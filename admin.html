<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>3EYE Admin</title>
<style>
:root{--bg:#04120b;--side:#03100a;--panel:#071e14;--panel2:#0a2819;--line:rgba(232,185,49,.22);--line2:rgba(232,185,49,.12);--gold:#e8b931;--gold2:#f7dc7a;--txt:#f2f5ef;--mut:#9db3a5;--ok:#1fd39a;--bad:#ff6b5e;--r:12px}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:1080px;margin:0 auto;padding:22px 24px 80px}
.shell{display:flex;min-height:100vh}.main{flex:1;min-width:0}
.side{width:236px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:3px;padding:18px 12px;background:var(--side);border-right:1px solid var(--line)}
.sb{color:var(--gold2);font-size:20px;font-weight:800;letter-spacing:.01em;padding:0 10px 12px;border-bottom:1px solid var(--line2);margin-bottom:4px}
.sp{flex:1}
.nvh{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#7f9a8a;margin:16px 10px 5px;font-weight:700}
button.nv{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border-radius:9px;background:none;color:#d6dfd3;border:1px solid transparent;padding:9px 12px;font-size:14.5px;font-weight:600}
button.nv:hover{background:rgba(232,185,49,.09)}button.nv.on{background:rgba(232,185,49,.16);color:var(--gold2);border-color:rgba(232,185,49,.45)}
.mbar{display:none;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:20;background:var(--side);border-bottom:1px solid var(--line)}.scrim{display:none}
/* page header */
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line2)}
h1{color:var(--gold2);font-size:24px;line-height:1.2;margin:0;font-weight:800}
.ph p{margin:4px 0 0}
h3{margin:16px 0 8px;color:var(--gold2);font-size:16px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
#note{min-height:0;margin:0 0 10px;font-size:14px}#note:empty{display:none}
/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:22px;line-height:1.25;color:var(--gold2);font-variant-numeric:tabular-nums}.stat span{font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.sec{display:flex;align-items:baseline;gap:8px;margin:22px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}.sec h3{margin:0}
.bar2{height:6px;border-radius:9px;background:#0b2a1a;overflow:hidden;margin:8px 0}.bar2 i{display:block;height:100%;background:var(--ok)}
.c-Open{color:var(--ok);border-color:var(--ok)}.c-Closed{color:var(--gold)}.c-Settled{background:var(--ok);color:#032015;border-color:var(--ok)}
/* buttons: clear press feedback */
button{font-family:inherit;font-weight:700;font-size:14.5px;padding:8px 14px;border-radius:9px;border:1.5px solid var(--gold);background:var(--gold);color:#2a1d00;cursor:pointer;transition:transform .08s,filter .12s,background .12s;position:relative}
button:hover{filter:brightness(1.07)}button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
button.g{background:none;color:var(--gold2)}button.g:hover{background:rgba(232,185,49,.1)}
button.no{background:none;color:var(--bad);border-color:var(--bad)}button.no:hover{background:rgba(255,107,94,.1)}
button.on{background:var(--gold2);color:#2a1d00}
button.ok2{background:var(--ok);border-color:var(--ok);color:#032015}
button.wait{opacity:.7;cursor:progress}
/* cards and rows */
.card,.row{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.row.s{padding:9px 12px;margin-bottom:6px}
.card:hover{border-color:rgba(232,185,49,.4)}
input,select,textarea{padding:9px 10px;margin:4px 4px 8px 0;border-radius:8px;border:1.5px solid rgba(232,185,49,.35);background:#04150d;color:#fff;font-size:15px;font-family:inherit;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{width:100%}
label{font-size:13.5px;display:inline-block;color:#cfdccf}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold2);vertical-align:middle;margin-left:4px;white-space:nowrap}
.c-Approved,.c-Active,.c-Running{color:var(--ok);border-color:var(--ok)}.c-Won{background:var(--ok);color:#032015;border-color:var(--ok)}.c-Rejected,.c-Suspended,.c-Lost,.c-Removed{color:var(--bad);border-color:var(--bad)}
.dot{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--bad);color:#fff;font-size:12.5px;text-align:center}
.seg2{display:flex;gap:6px;flex-wrap:wrap}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pick{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 0}.pick.off{opacity:.4;pointer-events:none}
.pick label{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:15px;border-bottom:1px solid var(--line2)}.pick input{margin:0;width:19px;height:19px}
.m{color:var(--mut);font-size:13.5px}.ok{color:var(--ok)}.bad{color:var(--bad)}a{color:var(--gold2)}
.empty{padding:26px 14px;text-align:center;color:var(--mut);background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}
/* payments table */
.pt{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);margin-bottom:12px}
.pth,.ptr{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(140px,1.1fr) 112px 128px 92px minmax(240px,1.3fr);gap:12px;align-items:center;padding:11px 14px}
.pth{background:var(--panel2);color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.ptr{border-top:1px solid var(--line2)}.ptr:hover{background:rgba(232,185,49,.04)}
.ptr>div{min-width:0;display:flex;flex-direction:column}
.ptr .c1{flex-direction:row;align-items:center;gap:10px}.ptr .c1>div{display:flex;flex-direction:column;min-width:0}.ptr .c1 b{overflow:hidden;text-overflow:ellipsis}
.ptr .c1 input[type=checkbox]{width:18px;height:18px;margin:0;flex:none}
.ptr .act{flex-direction:row;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.ptr .act input{width:96px;margin:0}
.ptr b{font-variant-numeric:tabular-nums}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;letter-spacing:.05em;color:var(--gold2);font-weight:700;word-break:break-all}
/* working feedback: spinner, top bar, toast */
.spin-i{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes rot{to{transform:rotate(360deg)}}
#topbar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:200;background:linear-gradient(90deg,transparent,var(--gold2),transparent);background-size:40% 100%;background-repeat:no-repeat;opacity:0;pointer-events:none;transition:opacity .15s}
body.busy #topbar{opacity:1;animation:slide 1s linear infinite}
@keyframes slide{from{background-position:-40% 0}to{background-position:140% 0}}
body.busy,body.busy *{cursor:progress}
body.busy #pane{opacity:.6;transition:opacity .15s}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,24px);z-index:300;max-width:min(92vw,520px);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14.5px;background:#0b2a1a;color:var(--txt);border:1.5px solid var(--gold);box-shadow:0 10px 34px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:var(--ok)}#toast.bad{border-color:var(--bad);color:#ffd2cc}#toast.warn{border-color:var(--gold)}
@media(max-width:1000px){
  .pth{display:none}
  .ptr{grid-template-columns:1fr 1fr;gap:10px 14px}
  .ptr .c1,.ptr .act{grid-column:1/-1}.ptr .act{justify-content:flex-start}
  .ptr>div[data-l]::before{content:attr(data-l);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:1px}
}
@media(max-width:860px){.side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-102%);transition:transform .2s}.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.7)}.mbar{display:flex}.side.open~.scrim{display:block;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55)}.w{padding:16px 14px 80px}h1{font-size:21px}input,select,textarea{font-size:16px}}
</style>
</head>
<body><div id="topbar"></div><div id="app"></div>
<script id="config">
/* Paste your deployed Apps Script web app URL here (it ends in /exec). It is safe for this to be public. */
window.API_URL = "https://script.google.com/macros/s/AKfycbzefvjwwFY___KN6aZS4J-eKcFdSvZhLq3a2JaOv9gBP6vRFR9UWsFfBxOTS8NjqPx2/exec";
window.PAY_INFO = "Send your contribution by M-Pesa as the admin instructs, then enter the M-Pesa confirmation code below.";
</script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kes=n=>'KES '+Math.round(+n||0).toLocaleString('en-US'),val=id=>($('#'+id)||{}).value;
const day=v=>{const d=new Date(v);return isNaN(d)?'':d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Africa/Nairobi'})};
const toLocal=v=>{const d=new Date(v);return isNaN(d)?'':new Date(d.getTime()+3*36e5).toISOString().slice(0,16)}; // Nairobi wall clock for datetime-local
const fromLocal=v=>v?v+':00+03:00':'';
let T=sessionStorage.getItem('tj_a'),tab='queue',pools=[],curMember=null;
let payFilter='Pending',payLimit=50,payCounts={All:0,Pending:0,Approved:0,Rejected:0},memQ='',memLimit=50,msgAll=true,msgSel=new Set(),msgMembers=[];
const STAGE={Pending:'Pending',Approved:'Approved',Running:'Currently running',Rejected:'Rejected',Won:'Won',Lost:'Lost',Removed:'Removed'};
const pct=sh=>{const p=(sh||0)*100;return(p>=10?p.toFixed(1):p>=1?p.toFixed(2):p.toFixed(3)).replace(/\.?0+$/,'')+'%';};
async function api(action,d){
  if(!window.API_URL)throw new Error('Set API_URL in assets/config.js first.');
  let r;try{r=await fetch(window.API_URL,{method:'POST',body:JSON.stringify(Object.assign({action,token:T},d||{}))});}catch(e){throw new Error('Could not reach the server.');}
  let j;try{j=await r.json();}catch(e){throw new Error('Unexpected reply from the server.');}
  if(!j.ok){if(/log in again/i.test(j.msg)){T=null;sessionStorage.removeItem('tj_a');}throw new Error(j.msg);}return j;}
let tt;
function toast(m,k){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.setAttribute('role','status');e.setAttribute('aria-live','polite');document.body.appendChild(e);}
  clearTimeout(tt);e.className='show '+(k||'ok');e.innerHTML=(k==='work'?'<i class="spin-i"></i>':k==='bad'?'&#9888; ':k==='warn'?'':'&#10003; ')+esc(m);
  if(k!=='work')tt=setTimeout(()=>e.classList.remove('show'),k==='bad'?7000:3800);}
const note=(m,bad)=>{const n=$('#note');if(n){n.textContent=m;n.className=bad?'bad':'ok';}toast(m,bad?'bad':'ok');};
/* ---------- click guard: one action at a time, visible feedback on every click ----------
   The first click locks the whole dashboard until the server answers. Any click that arrives meanwhile is ignored with a
   "please wait" notice, so an approval, payout, contribution or message can never be sent twice by a double click. */
const QUICK=new Set(['opennav','closenav','selall','msgselall','msgclear','clearfx','closedetail','cancelreplace']);
const LBL={verify:b=>b.dataset.r?'Rejecting…':'Approving…',verifymany:'Approving selected…',payout:'Recording payout…',payall:'Recording payouts…',contrib:'Recording…',sendmsg:'Sending…',publishfx:'Publishing…',loadfx:'Reading…',savepool:'Saving…',savemember:'Saving…',editcontrib:'Saving…',editpayrec:'Saving…',delpool:'Deleting…',delmember:'Deleting…',delcontrib:'Deleting…',delpayrec:'Deleting…',reset:'Requesting…',decidereset:'Working…',decideunlock:'Working…',unlockm:'Unlocking…',togglesuspend:'Updating…',exportcsv:'Exporting…',search:'Searching…',refresh:'Refreshing…',settle:'Loading…'};
const lblOf=b=>{const l=b&&LBL[b.dataset.act];return typeof l==='function'?l(b):(l||'Loading…');};
let LOCK=false;
async function guarded(b,fn,label){
  if(LOCK){toast('Please wait, the last action is still running.','warn');return;}
  LOCK=true;document.body.classList.add('busy');
  const lab=label||lblOf(b),keep=b?b.innerHTML:'';
  if(b){b.style.minWidth=b.offsetWidth+'px';b.disabled=true;if(b.classList.contains('nv'))b.classList.add('wait');else b.innerHTML='<i class="spin-i"></i>'+esc(lab);}
  toast(lab,'work');
  try{await fn();}
  catch(e){if(!T)draw(e.message);else note(e.message,true);}
  finally{
    LOCK=false;document.body.classList.remove('busy');
    const t=$('#toast');if(t&&t.classList.contains('work'))t.classList.remove('show');
    if(b&&b.isConnected){b.disabled=false;b.classList.remove('wait');b.style.minWidth='';if(!b.classList.contains('nv'))b.innerHTML=keep;}
  }
}
async function run(f){try{await f();}catch(e){if(!T)draw(e.message);else note(e.message,true);}}
const opts=sel=>pools.map(p=>`<option value="${esc(p.poolId)}"${p.poolId===sel?' selected':''}>${esc(p.name)} (${esc(p.shown)})</option>`).join('');
const loadPools=async()=>{pools=(await api('pools')).list;};

function draw(err){
  if(!T){$('#app').innerHTML=`<div class="w"><div class="top"><h1>3EYE Admin</h1></div><form id="lf" class="card"><label>Email<br><input name="email" type="email" autocomplete="username" required></label><br><label>Password<br><input name="password" type="password" autocomplete="current-password" required></label><br><button type="submit">Log in</button><p class="bad" id="note">${esc(err||'')}</p></form></div>`;
    $('#lf').onsubmit=e=>{e.preventDefault();const f=e.target;guarded(f.querySelector('button'),async()=>{const j=await api('adminLogin',{email:f.email.value,password:f.password.value});T=j.token;sessionStorage.setItem('tj_a',T);await draw();},'Logging in…');};return;}
  $('#app').innerHTML=`<div class="shell"><aside class="side" id="side"><div class="sb">3EYE Admin</div><nav id="nav"></nav><div class="sp"></div><button class="nv" data-act="out">Log out</button></aside><div class="scrim" data-act="closenav"></div><div class="main"><div class="mbar"><button class="g" data-act="opennav" aria-label="Open menu">&#9776;</button><b id="ptitle" style="color:#f7dc7a"></b></div><div class="w"><div class="ph"><div><h1 id="h1"></h1><p id="sub" class="m"></p></div><button class="g" data-act="refresh">&#8635; Refresh</button></div><p id="note" class="m"></p><div id="pane"><div class="empty"><i class="spin-i"></i>Loading…</div></div></div></div></div>`;
  drawTabs();refreshBadge();return run(panes[tab]);}
const NAV=[['Operations',[['queue','Payments'],['members','Members'],['resets','PIN & unlocks']]],['Pools',[['live','Update pools'],['running','Paid pools']]],['Communication',[['msgs','Messages']]],['System',[['log','Log']]]];
const SUB={queue:'Check each M-Pesa code against your M-Pesa messages before you approve.',members:'Search, edit and suspend members, or record a contribution.',resets:'Confirm with the member on WhatsApp before you approve.',live:'Post a jackpot and manage every pool.',running:'Pools that hold contributions, and their payouts.',msgs:'Messages show on each member\'s dashboard.',log:'The most recent admin actions.'};
const TITLE={};NAV.forEach(g=>g[1].forEach(x=>TITLE[x[0]]=x[1]));
const drawTabs=()=>{const n=$('#nav');if(!n)return;n.innerHTML=NAV.map(g=>`<div class="nvh">${g[0]}</div>`+g[1].map(([k,l])=>`<button class="nv${k===tab?' on':''}" data-act="tab" data-t="${k}">${l}${k==='queue'&&payCounts.Pending?`<span class="dot">${payCounts.Pending}</span>`:''}</button>`).join('')).join('');$('#h1').textContent=TITLE[tab]||'';$('#ptitle').textContent=TITLE[tab]||'';const sb=$('#sub');if(sb)sb.textContent=SUB[tab]||'';};
async function refreshBadge(){try{const j=await api('payments',{status:'Pending',limit:1});payCounts=j.counts;drawTabs();}catch(e){}}

/* ---------- jackpot posting: catalog, fixture parser, preview ---------- */
/* Keep equal to JACKPOTS in Code.gs. Stake = 2^doubles lines x price per line (always the highest stake). */
const CATALOG={sp_midweek:{name:'SportPesa Midweek Jackpot',matches:13,doubles:7,price:99},sp_mega:{name:'SportPesa Mega Jackpot',matches:17,doubles:10,price:99},bt_mbw:{name:'Betika Must Be Won Jackpot',matches:15,doubles:6,price:49},bt_midweek:{name:'Betika Midweek Jackpot',matches:13,doubles:7,price:15}};
const stakeOf=c=>Math.pow(2,c.doubles)*c.price;
let fx=[],fxJack='sp_midweek',replaceId=null,replaceName='',fxInfo='',pj={prize:'',fee:'0',min:'100'};
const pad2=n=>String(n).padStart(2,'0');
function mkIso(y,mo,d,h,mi){const dt=new Date(Date.UTC(y,mo-1,d,h,mi));if(h>23||mi>59||dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d)return '';return y+'-'+pad2(mo)+'-'+pad2(d)+'T'+pad2(h)+':'+pad2(mi)+':00+03:00';}
/* Reads a SportPesa or Betika paste. Odds are read past and thrown away. All times are Nairobi time. */
function parseFixtures(text){
  const lines=String(text||'').split(/\r?\n|\t/).map(x=>x.trim()).filter(Boolean),list=[],warn=[];
  const cy=new Date(Date.now()+3*36e5).getUTCFullYear(),year=v=>+v<100?2000+ +v:+v;
  const hdr=/^soccer\s*[\u2022\u00b7|:\-\u2013]\s*(\S.*)$/i;
  const betika=lines.some(l=>hdr.test(l));
  if(betika){
    let i=0;
    while(i<lines.length){
      const h=lines[i].match(hdr);if(!h){i++;continue;}
      let j=i+1;const blk=[];while(j<lines.length&&!hdr.test(lines[j]))blk.push(lines[j++]);
      const dm=(blk[0]||'').match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?,?\s*[-\u2013]?\s*(\d{1,2}):(\d{2})$/);
      if(!dm||blk.length<3){warn.push('Could not read the match after "'+lines[i]+'"');i=j;continue;}
      let iso=mkIso(dm[3]?year(dm[3]):cy,+dm[2],+dm[1],+dm[4],+dm[5]);
      if(iso&&!dm[3]&&new Date(iso).getTime()<Date.now()-30*864e5)iso=mkIso(cy+1,+dm[2],+dm[1],+dm[4],+dm[5]);   // no year on Betika: roll Dec to Jan
      if(!iso)warn.push('Bad date for '+blk[1]+' vs '+blk[2]);
      list.push({home:blk[1],away:blk[2],league:h[1].trim(),kick:iso,dc:false});i=j;
    }
  }else{
    const dre=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s*[-\u2013]\s*(\d{1,2}):(\d{2})$/;
    for(let i=0;i<lines.length;i++){
      const dm=lines[i].match(dre);if(!dm)continue;
      const home=lines[i+1],away=lines[i+2];
      if(!home||!away||/^[\d.]+$/.test(home)||/^[\d.]+$/.test(away)||dre.test(home)||dre.test(away)){warn.push('Could not read the teams after "'+lines[i]+'"');continue;}
      const iso=mkIso(year(dm[3]),+dm[2],+dm[1],+dm[4],+dm[5]);if(!iso)warn.push('Bad date for '+home+' vs '+away);
      list.push({home,away,league:'',kick:iso,dc:false});i+=2;
    }
  }
  return{list,warn,format:betika?'Betika':'SportPesa'};
}
const need=()=>CATALOG[fxJack];
function previewHtml(){
  if(!fx.length)return '';
  const inp=(k,i,v,w)=>`<input data-fx="${k}" data-i="${i}" value="${esc(v)}" style="width:${w}px;margin:0">`;
  return `<div id="pj-cnt" class="card" style="margin:10px 0"></div><div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:15px"><tr class="m"><td>#</td><td>Kickoff (Nairobi)</td><td>League</td><td>Home</td><td>Away</td><td>Double</td></tr>`+

  async closedetail(){curMember=null;$('#detail').innerHTML='';},
  async open(b){await showMember(b.dataset.p);},
  async savemember(b){const j=await api('editMember',{phone:b.dataset.p,fields:{name:val('mn'),phone:val('mp'),status:val('ms'),payTo:val('mpay')}});await showMember(val('mp'),true);await loadMemList();note(j.msg);},
  async unlockm(b){note((await api('unlockMember',{phone:b.dataset.p})).msg);await showMember(b.dataset.p);},
  async delmember(b){if(!confirm('Delete this member? This cannot be undone.'))return;const j=await api('deleteMember',{phone:b.dataset.p});curMember=null;await panes.members();note(j.msg);},
  async reset(b){const pin=ask('New 4-character PIN (letters or numbers) for this member (tell them on WhatsApp):');if(!pin)return;const j=await api('requestReset',{phone:b.dataset.p,pin});note(j.msg+' Approve it under PIN resets.');},
  async contrib(){note((await api('contribute',{phone:val('cp'),poolId:val('cpool'),amount:val('ca')})).msg);await loadMemList();if(curMember)await showMember(curMember,true);},
  async editcontrib(b){const a=ask('Correct amount (KES):',b.dataset.a);if(!a)return;note((await api('editContribution',{id:b.dataset.id,fields:{amount:a}})).msg);await showMember(curMember);},
  async delcontrib(b){if(!confirm('Delete this contribution? The member is notified.'))return;note((await api('deleteContribution',{id:b.dataset.id})).msg);await showMember(curMember);},
  async editpayrec(b){const a=ask('Correct payout amount (KES):',b.dataset.a);if(!a)return;note((await api('editPayout',{id:b.dataset.id,fields:{amount:a}})).msg);await showMember(curMember);},
  async delpayrec(b){if(!confirm('Delete this payout record? The member is notified.'))return;note((await api('deletePayout',{id:b.dataset.id})).msg);await showMember(curMember);},
  async loadfx(){const r=parseFixtures(val('pj-paste'));fx=r.list;fxInfo=r.list.length?'Read '+r.list.length+' matches ('+r.format+' format).'+(r.warn.length?' '+r.warn.join(' '):''):'No matches found in that text. '+r.warn.join(' ');$('#pj-prev').innerHTML=previewHtml();$('#pj-info').textContent=fxInfo;updateCounters();},
  async clearfx(){fx=[];fxInfo='';const t=$('#pj-paste');if(t)t.value='';$('#pj-prev').innerHTML='';$('#pj-info').textContent='';updateCounters();},
  async replacefx(b){tab='live';replaceId=b.dataset.id;replaceName=b.dataset.n;fxJack=b.dataset.j;fx=[];fxInfo='';drawTabs();await panes.live();window.scrollTo(0,0);note('Paste the full fixture list again, tick the doubles, then Save fixtures.');},
  async cancelreplace(){replaceId=null;fx=[];fxInfo='';await panes.pools();},
  async publishfx(){const c=need(),d=fx.filter(r=>r.dc).length;
    if(!confirm((replaceId?'Replace the fixtures of ':'Post ')+c.name+' with '+fx.length+' matches ('+d+' doubles)'+(replaceId?'?':' to the website?')))return;
    const matches=fx.map(r=>({home:r.home.trim(),away:r.away.trim(),league:r.league.trim(),kickoff:r.kick,type:r.dc?'DC':'S'}));
    const j=replaceId?await api('saveMatches',{poolId:replaceId,matches}):await api('publishJackpot',{jackpot:fxJack,prize:pj.prize,fee:pj.fee,minStake:pj.min,matches});
    fx=[];fxInfo='';replaceId=null;pj.prize='';await panes.pools();note(j.msg);},
  async savepool(b){const id=b.dataset.id,f={},k=val('ko-'+id);[['name','nm'],['status','st'],['prize','pz'],['won','wn'],['fee','fe'],['min','mi']].forEach(([n,p])=>{const v=val(p+'-'+id);if(v!==undefined)f[n]=v;});if(k)f.kickoff=fromLocal(k);const j=await api('updatePool',{poolId:id,fields:f});await panes.pools();note(j.msg);},
  async delpool(b){const id=b.dataset.id,p=pools.find(x=>x.poolId===id)||{},money=p.total>0||p.members>0;
    if(money){const t=prompt('This pool has '+kes(p.total)+' from '+p.members+' member(s). Deleting it permanently removes the pool, its fixtures, contributions, payments and payouts (and any later rounds of the same jackpot). A backup copy of the Sheet is made first and members are notified.\n\nType DELETE to confirm:');if(t!=='DELETE')return;}
    else if(!confirm('Delete this pool?'))return;
    const j=await api('deletePool',{poolId:id,force:true});await panes.pools();note(j.msg);},
  async settle(b){await showSettle(b.dataset.id);},
  selall(){const c=[...document.querySelectorAll('.pk')].filter(x=>x.closest('.ptr').style.display!=='none');const on=c.some(x=>!x.checked);c.forEach(x=>x.checked=on);},
  async verifymany(){const ids=[...document.querySelectorAll('.pk:checked')].map(x=>x.dataset.q);if(!ids.length)return note('Tick at least one payment first.',true);if(!confirm('Approve '+ids.length+' payment(s) at the declared amounts?'))return;const j=await api('verifyMany',{ids});await panes.queue();note(j.msg);},
  async payall(b){if(!confirm('Record every unpaid suggested payout for this pool? Members are notified.'))return;const j=await api('payoutMany',{poolId:b.dataset.id});await showSettle(b.dataset.id);note(j.msg);},
  async payout(b){const a=ask('Amount paid out (KES):',b.dataset.a);if(!a)return;const j=await api('payout',{poolId:b.dataset.id,phone:b.dataset.p,amount:a,note:'M-Pesa'});await showSettle(b.dataset.id);note(j.msg);},
  async msgselall(){document.querySelectorAll('#pick label').forEach(l=>{if(l.style.display==='none')return;const c=l.querySelector('input');c.checked=true;msgSel.add(c.value);});msgCount();},
  async msgclear(){msgSel.clear();document.querySelectorAll('#pick input').forEach(c=>c.checked=false);msgCount();},
  async sendmsg(){if(!msgAll&&!msgSel.size)throw new Error('Tick at least one member, or choose Send to all.');if(!confirm(msgAll?'Send this message to ALL members?':'Send this message to '+msgSel.size+' member(s)?'))return;const j=await api('message',{to:msgAll?'ALL':Array.from(msgSel),title:val('mti'),body:val('mb')});msgSel.clear();await panes.msgs();note(j.msg);}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;if(QUICK.has(a)){run(()=>acts[a](b));return;}guarded(b,()=>acts[a](b));});
document.addEventListener('input',e=>{if(e.target.id!=='pq')return;const t=e.target.value.toLowerCase();document.querySelectorAll('#pane .ptr').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(t)?'':'none';});});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();guarded(null,()=>acts.search(),'Searching…');}});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset&&t.dataset.fx,g=t.dataset&&t.dataset.msg;
  if(g){if(g==='all'){msgAll=t.checked;$('#pick').classList.toggle('off',msgAll);}else if(g==='m'){t.checked?msgSel.add(t.value):msgSel.delete(t.value);}else if(g==='filter'){const f=t.value.toLowerCase().trim();document.querySelectorAll('#pick label').forEach(l=>l.style.display=!f||l.dataset.n.indexOf(f)>-1?'':'none');}msgCount();return;}
  if(k){const r=fx[+t.dataset.i];if(!r)return;if(k==='dc')r.dc=t.checked;else if(k==='kick')r.kick=fromLocal(t.value);else r[k]=t.value;updateCounters();return;}
  if(t.id==='pj-jack'){fxJack=t.value;updateRule();updateCounters();}
  else if(t.id==='pj-prize')pj.prize=t.value;else if(t.id==='pj-fee')pj.fee=t.value;else if(t.id==='pj-min')pj.min=t.value;});
draw();
</script></body></html>
