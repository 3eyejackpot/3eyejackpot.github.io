body{margin:0;background:#04120b;color:#f2f5ef;font:17px/1.5 "Times New Roman",Times,"Liberation Serif","Noto Serif",Georgia,serif}
.w{max-width:820px;margin:0 auto;padding:16px}h1{color:#f7dc7a;font-size:24px;margin:0}h3{margin:14px 0 6px;color:#f7dc7a;font-size:17px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

button{font-family:inherit;font-weight:700;font-size:15.5px;padding:8px 13px;border-radius:999px;border:1.5px solid #e8b931;background:#e8b931;color:#2a1d00;cursor:pointer}
button:disabled{opacity:.5}button.g{background:none;color:#f7dc7a}button.no{background:none;color:#ff6b5e;border-color:#ff6b5e}button.on{background:#f7dc7a}

.c-Approved,.c-Active,.c-Running{color:#1fd39a;border-color:#1fd39a}.c-Won{background:#1fd39a;color:#032015;border-color:#1fd39a}.c-Rejected,.c-Suspended,.c-Lost,.c-Removed{color:#ff6b5e;border-color:#ff6b5e}

.m{color:#a5bbae;font-size:15px}.ok{color:#1fd39a}.bad{color:#ff6b5e}a{color:#f7dc7a}label{font-size:14.5px;display:inline-block}

<body><div class="w" id="app"></div>
<script id="config">
/* Paste your deployed Apps Script web app URL here (it ends in /exec). It is safe for this to be public. */
window.API_URL = "https://script.google.com/macros/s/AKfycbzefvjwwFY___KN6aZS4J-eKcFdSvZhLq3a2JaOv9gBP6vRFR9UWsFfBxOTS8NjqPx2/exec";
window.PAY_INFO = "Send your contribution by M-Pesa as the admin instructs, then enter the M-Pesa confirmation code below.";
</script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kes=n=>'KES '+Math.round(+n||0).toLocaleString('en-US'),val=id=>($('#'+id)||{}).value;
const day=v=>{const d=new Date(v);return isNaN(d)?'':d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Africa/Nairobi'})};
const toLocal=v=>{const d=new Date(v);return isNaN(d)?'':new Date(d.getTime()+3*36e5).toISOString().slice(0,16)}; // Nairobi wall clock for datetime-local
const fromLocal=v=>v?v+':00+03:00':'';
let T=sessionStorage.getItem('tj_a'),tab='queue',pools=[],curMember=null;
let payFilter='Pending',payLimit=50,payCounts={All:0,Pending:0,Approved:0,Rejected:0},memQ='',memLimit=50,msgAll=true,msgSel=new Set(),msgMembers=[];
const STAGE={Pending:'Pending',Approved:'Approved',Running:'Currently running',Rejected:'Rejected',Won:'Won',Lost:'Lost',Removed:'Removed'};
const pct=sh=>{const p=(sh||0)*100;return(p>=10?p.toFixed(1):p>=1?p.toFixed(2):p.toFixed(3)).replace(/\.?0+$/,'')+'%';};
async function api(action,d){
  if(!window.API_URL)throw new Error('Set API_URL in assets/config.js first.');
  let r;try{r=await fetch(window.API_URL,{method:'POST',body:JSON.stringify(Object.assign({action,token:T},d||{}))});}catch(e){throw new Error('Could not reach the server.');}
  let j;try{j=await r.json();}catch(e){throw new Error('Unexpected reply from the server.');}
  if(!j.ok){if(/log in again/i.test(j.msg)){T=null;sessionStorage.removeItem('tj_a');}throw new Error(j.msg);}return j;}
const note=(m,bad)=>{const n=$('#note');if(n){n.textContent=m;n.className=bad?'bad':'ok';}};
async function run(f){try{await f();}catch(e){if(!T)draw(e.message);else note(e.message,true);}}
const opts=sel=>pools.map(p=>`<option value="${esc(p.poolId)}"${p.poolId===sel?' selected':''}>${esc(p.name)} (${esc(p.shown)})</option>`).join('');
const loadPools=async()=>{pools=(await api('pools')).list;};

function draw(err){
  if(!T){$('#app').innerHTML=`<div class="top"><h1>3EYE Admin</h1></div><form id="lf" class="card"><label>Email<br><input name="email" type="email" autocomplete="username" required></label><br><label>Password<br><input name="password" type="password" autocomplete="current-password" required></label><br><button type="submit">Log in</button><p class="bad" id="note">${esc(err||'')}</p></form>`;
    $('#lf').onsubmit=e=>{e.preventDefault();const f=e.target;run(async()=>{const j=await api('adminLogin',{email:f.email.value,password:f.password.value});T=j.token;sessionStorage.setItem('tj_a',T);draw();});};return;}
  const names={queue:'Payments',resets:'PIN & unlocks',members:'Members',pools:'Pools',msgs:'Messages',log:'Log'};
  window.tabNames=names;
  $('#app').innerHTML=`<div class="top"><h1>3EYE Admin</h1><button class="g" data-act="out">Log out</button></div><div class="tabs" id="tabs"></div><p id="note" class="m"></p><div id="pane"></div>`;
  drawTabs();run(panes[tab]);refreshBadge();}
const drawTabs=()=>{const t=$('#tabs');if(t)t.innerHTML=Object.keys(window.tabNames).map(k=>`<button class="${k===tab?'on':'g'}" data-act="tab" data-t="${k}">${window.tabNames[k]}${k==='queue'&&payCounts.Pending?`<span class="dot">${payCounts.Pending}</span>`:''}</button>`).join('');};
async function refreshBadge(){try{const j=await api('payments',{status:'Pending',limit:1});payCounts=j.counts;drawTabs();}catch(e){}}

/* ---------- jackpot posting: catalog, fixture parser, preview ---------- */
/* Keep equal to JACKPOTS in Code.gs. Stake = 2^doubles lines x price per line (always the highest stake). */
const CATALOG={sp_midweek:{name:'SportPesa Midweek Jackpot',matches:13,doubles:7,price:99},sp_mega:{name:'SportPesa Mega Jackpot',matches:17,doubles:10,price:99},bt_mbw:{name:'Betika Must Be Won Jackpot',matches:15,doubles:6,price:49},bt_midweek:{name:'Betika Midweek Jackpot',matches:13,doubles:7,price:15}};
const stakeOf=c=>Math.pow(2,c.doubles)*c.price;
let fx=[],fxJack='sp_midweek',replaceId=null,replaceName='',fxInfo='',pj={prize:'',fee:'0',min:'100'};
const pad2=n=>String(n).padStart(2,'0');
function mkIso(y,mo,d,h,mi){const dt=new Date(Date.UTC(y,mo-1,d,h,mi));if(h>23||mi>59||dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d)return '';return y+'-'+pad2(mo)+'-'+pad2(d)+'T'+pad2(h)+':'+pad2(mi)+':00+03:00';}
/* Reads a SportPesa or Betika paste. Odds are read past and thrown away. All times are Nairobi time. */
function parseFixtures(text){
  const lines=String(text||'').split(/\r?\n|\t/).map(x=>x.trim()).filter(Boolean),list=[],warn=[];
  const cy=new Date(Date.now()+3*36e5).getUTCFullYear(),year=v=>+v<100?2000+ +v:+v;
  const hdr=/^soccer\s*[\u2022\u00b7|:\-\u2013]\s*(\S.*)$/i;
  const betika=lines.some(l=>hdr.test(l));
  if(betika){
    let i=0;
    while(i<lines.length){
      const h=lines[i].match(hdr);if(!h){i++;continue;}
      let j=i+1;const blk=[];while(j<lines.length&&!hdr.test(lines[j]))blk.push(lines[j++]);
      const dm=(blk[0]||'').match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?,?\s*[-\u2013]?\s*(\d{1,2}):(\d{2})$/);
      if(!dm||blk.length<3){warn.push('Could not read the match after "'+lines[i]+'"');i=j;continue;}
      let iso=mkIso(dm[3]?year(dm[3]):cy,+dm[2],+dm[1],+dm[4],+dm[5]);
      if(iso&&!dm[3]&&new Date(iso).getTime()<Date.now()-30*864e5)iso=mkIso(cy+1,+dm[2],+dm[1],+dm[4],+dm[5]);   // no year on Betika: roll Dec to Jan
      if(!iso)warn.push('Bad date for '+blk[1]+' vs '+blk[2]);
      list.push({home:blk[1],away:blk[2],league:h[1].trim(),kick:iso,dc:false});i=j;
    }
  }else{
    const dre=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s*[-\u2013]\s*(\d{1,2}):(\d{2})$/;
    for(let i=0;i<lines.length;i++){
      const dm=lines[i].match(dre);if(!dm)continue;
      const home=lines[i+1],away=lines[i+2];
      if(!home||!away||/^[\d.]+$/.test(home)||/^[\d.]+$/.test(away)||dre.test(home)||dre.test(away)){warn.push('Could not read the teams after "'+lines[i]+'"');continue;}
      const iso=mkIso(year(dm[3]),+dm[2],+dm[1],+dm[4],+dm[5]);if(!iso)warn.push('Bad date for '+home+' vs '+away);
      list.push({home,away,league:'',kick:iso,dc:false});i+=2;
    }
  }
  return{list,warn,format:betika?'Betika':'SportPesa'};
}
const need=()=>CATALOG[fxJack];
function previewHtml(){
  if(!fx.length)return '';
  const inp=(k,i,v,w)=>`<input data-fx="${k}" data-i="${i}" value="${esc(v)}" style="width:${w}px;margin:0">`;
  return `<div id="pj-cnt" class="card" style="margin:10px 0"></div><div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:15px"><tr class="m"><td>#</td><td>Kickoff (Nairobi)</td><td>League</td><td>Home</td><td>Away</td><td>Double</td></tr>`+
    fx.map((r,i)=>`<tr><td class="m">${i+1}</td><td><input data-fx="kick" data-i="${i}" type="datetime-local" value="${esc(toLocal(r.kick))}" style="width:185px;margin:0"></td><td>${inp('league',i,r.league,130)}</td><td>${inp('home',i,r.home,150)}</td><td>${inp('away',i,r.away,150)}</td><td style="text-align:center"><input data-fx="dc" data-i="${i}" type="checkbox"${r.dc?' checked':''} style="width:20px;height:20px;margin:0"></td></tr>`).join('')+'</table></div>';
}
function updateRule(){const c=need(),e=$('#pj-rule');if(e)e.textContent=c.matches+' matches · '+c.doubles+' doubles ('+Math.pow(2,c.doubles).toLocaleString('en-US')+' lines × '+kes(c.price)+') = full stake '+kes(stakeOf(c));}
function updateCounters(){
  const c=need(),box=$('#pj-cnt'),btn=$('#pj-go');if(!btn)return;
  const n=fx.length,d=fx.filter(r=>r.dc).length,bad=fx.filter(r=>!r.home.trim()||!r.away.trim()||!r.kick).length,ok=n===c.matches&&d===c.doubles&&!bad;
  btn.disabled=!ok;
  if(!box)return;
  const cl=(a,b)=>a===b?'ok':'bad',ks=fx.map(r=>new Date(r.kick).getTime()).filter(x=>!isNaN(x)).sort((a,b)=>a-b);
  box.innerHTML=`Matches loaded: <b class="${cl(n,c.matches)}">${n} / ${c.matches}</b>${n<c.matches?` <span class="m">(${c.matches-n} missing)</span>`:n>c.matches?` <span class="bad">(${n-c.matches} too many)</span>`:' <span class="ok">✓</span>'}`+
    ` &nbsp;·&nbsp; Doubles marked: <b class="${cl(d,c.doubles)}">${d} / ${c.doubles}</b>${d===c.doubles?' <span class="ok">✓</span>':''}`+
    (bad?`<br><span class="bad">${bad} row(s) have a missing team or kickoff.</span>`:'')+
    (ks.length?`<br><span class="m">First kickoff ${esc(day(ks[0]))} · pool closes ${esc(day(ks[0]-30*60000))} · the jackpot leaves the website when that match starts.</span>`:'');
}
const postCard=()=>{const c=need();return `<div class="card"><b>${replaceId?'Replace fixtures':'Post a jackpot'}</b>${replaceId?` <span class="m">for ${esc(replaceName)}</span> <button class="g" data-act="cancelreplace">Cancel</button>`:''}<br>
  <label>Which jackpot <select id="pj-jack" ${replaceId?'disabled':''}>${Object.keys(CATALOG).map(k=>`<option value="${k}"${k===fxJack?' selected':''}>${esc(CATALOG[k].name)}</option>`).join('')}</select></label><div class="m" id="pj-rule"></div>
  ${replaceId?'':`<label>Prize (KES) <input id="pj-prize" type="number" value="${esc(pj.prize)}" style="width:150px"></label> <label>Fee % <input id="pj-fee" type="number" value="${esc(pj.fee)}" style="width:75px"></label> <label>Minimum stake per client (KES) <input id="pj-min" type="number" value="${esc(pj.min)}" style="width:110px"></label><br>`}
  <textarea id="pj-paste" rows="6" placeholder="Paste the fixture list copied from SportPesa or Betika here. Odds are ignored."></textarea>
  <button data-act="loadfx">Load fixtures</button> <button class="g" data-act="clearfx">Clear</button> <span class="m" id="pj-info">${esc(fxInfo)}</span>
  <div id="pj-prev">${previewHtml()}</div>
  <button id="pj-go" data-act="publishfx" disabled>${replaceId?'Save fixtures':'Publish to website'}</button> <span class="m">Tick the ${c.doubles} double-chance (DC) matches. The website shows DC or Single for each match and keeps the selection locked. No odds or picks are stored.</span></div>`;};
const poolCard=p=>{const c=CATALOG[p.jackpot];return `<div class="card"><b>${esc(p.label)}</b> <span class="m">${esc(p.poolId)} · showing as ${esc(p.shown)}</span><br><span class="m">Collected ${kes(p.total)} from ${p.members} members · target ${kes(p.target)} · fee ${p.fee}% · min stake ${kes(p.min)} · closes ${esc(day(p.closes))}${c?` · fixtures ${p.matchCount}/${c.matches}, doubles ${p.doubles}/${c.doubles}`:''}<br>Leaves the website at first kickoff: ${esc(day(p.kickoff))}</span><br>
  <label>Name <input id="nm-${esc(p.poolId)}" value="${esc(p.name)}"></label> <label>Kickoff <input id="ko-${esc(p.poolId)}" type="datetime-local" value="${esc(toLocal(p.kickoff))}"></label><br>
  <label>Status <select id="st-${esc(p.poolId)}">${['Open','Closed','Settled'].map(s=>`<option${s===p.status?' selected':''}>${s}</option>`).join('')}</select></label> <label>Prize <input id="pz-${esc(p.poolId)}" type="number" value="${p.prize}" style="width:120px"></label> <label>Amount won <input id="wn-${esc(p.poolId)}" type="number" value="${p.won}" style="width:120px"></label> <label>Fee % <input id="fe-${esc(p.poolId)}" type="number" value="${p.fee}" style="width:70px"></label> <label>Min stake <input id="mi-${esc(p.poolId)}" type="number" value="${p.min}" style="width:90px"></label><br>
  <button data-act="savepool" data-id="${esc(p.poolId)}">Save</button> ${c?`<button class="g" data-act="replacefx" data-id="${esc(p.poolId)}" data-j="${esc(p.jackpot)}" data-n="${esc(p.name)}">Replace fixtures</button> `:''}<button class="g" data-act="settle" data-id="${esc(p.poolId)}">Payouts</button> <button class="no" data-act="delpool" data-id="${esc(p.poolId)}">Delete</button></div>`;};

const stakeAdm=s=>`<div class="card" style="margin:0 0 8px"><b>${esc(s.jackpot)}</b> <span class="chip c-${esc(s.stage)}">${esc(STAGE[s.stage]||s.stage)}</span><br><span class="m">${s.kind==='recorded'?'Recorded by admin':'M-Pesa '+esc(s.ref)} · ${esc(day(s.date))}${s.decidedAt?' · decided '+esc(day(s.decidedAt)):''}</span><br>
  Stake <b>${kes(s.amount)}</b>${s.stage==='Rejected'||s.stage==='Removed'?'':` · share <b>${s.split?'split':pct(s.share)}</b>${s.stage==='Pending'?' (est.)':''} · ${s.stage==='Won'?'winnings':'to win'} <b>${s.stage==='Lost'?'none':kes(s.wouldPay)}</b>`}
  ${s.slices.filter(x=>x.cid).map(x=>`<div class="row s"><div>${esc(x.name)} · <b>${kes(x.amt)}</b> <span class="m">${pct(x.share)}</span></div><div><button class="g" data-act="editcontrib" data-id="${esc(x.cid)}" data-a="${x.amt}">Edit</button> <button class="no" data-act="delcontrib" data-id="${esc(x.cid)}">Delete</button></div></div>`).join('')}</div>`;
const memberView=d=>{const m=d.member,odd=m.status!=='Approved'&&m.status!=='Suspended',row=(r,k)=>`<div class="row s"><div>${esc(r.pool)} · <b>${kes(r.amount)}</b> <span class="m">${esc(day(r.date))}${r.note?' · '+esc(r.note):''}</span></div><div><button class="g" data-act="edit${k}" data-id="${esc(r.id)}" data-a="${r.amount}">Edit</button> <button class="no" data-act="del${k}" data-id="${esc(r.id)}">Delete</button></div></div>`;
  return `<div class="card"><div class="top" style="margin:0"><b>${esc(m.name)} <span class="chip c-${esc(m.label)}">${esc(m.label)}</span></b><button class="g" data-act="closedetail">Close</button></div><span class="m">${esc(m.phone)} · joined ${esc(day(m.created))} · terms ${esc(m.terms||'n/a')}</span><br>
  <label>Name <input id="mn" value="${esc(m.name)}"></label><label>Phone <input id="mp" value="${esc(m.phone)}"></label>
  <label>Pay-to details (shown only in this member's account) <input id="mpay" value="${esc(m.payTo)}" style="width:100%;box-sizing:border-box" maxlength="200" placeholder="e.g. Send to 07XX XXX XXX (Name)"></label><br><span class="m">PIN: <b>${esc(m.pin)}</b>${m.locked?' · <span class="bad">locked</span>':''}</span><br>
  <label>Status <select id="ms"><option value="Approved"${m.status==='Approved'?' selected':''}>Active</option><option value="Suspended"${m.status==='Suspended'?' selected':''}>Suspended</option>${odd?`<option selected>${esc(m.status)}</option>`:''}</select></label>
  <button data-act="savemember" data-p="${esc(m.phone)}">Save</button> <button class="g" data-act="reset" data-p="${esc(m.phone)}">Set new PIN</button> ${m.locked?`<button class="g" data-act="unlockm" data-p="${esc(m.phone)}">Unlock</button>`:''} <button class="no" data-act="delmember" data-p="${esc(m.phone)}">Delete</button>
  <h3>Stakes (as the member sees them)</h3>${d.stakes.map(stakeAdm).join('')||'<p class="m">None.</p>'}
  <h3>Payouts</h3>${d.payouts.map(r=>row(r,'payrec')).join('')||'<p class="m">None.</p>'}</div>`;};
const payRow=x=>`<div class="row"><div>${x.status==='Pending'?`<input type="checkbox" class="pk" data-q="${esc(x.queueId)}" aria-label="Select" style="width:auto"> `:''}<b>${esc(x.name||x.phone)}</b> · ${esc(x.phone)} <span class="chip c-${esc(x.status)}">${esc(x.status)}</span><br><span class="m">${esc(x.pool||'Pool removed')} · sent ${esc(day(x.time))} · M-Pesa code</span> <b>${esc(x.ref)}</b><br><span class="m">Declared ${kes(x.declared)}${x.approved!=null&&x.approved!==x.declared?' · approved '+kes(x.approved):''}${x.decidedAt?' · '+(x.status==='Rejected'?'rejected ':'approved ')+esc(day(x.decidedAt)):''}</span></div>${x.status==='Pending'?`<div><input id="amt-${esc(x.queueId)}" type="number" value="${x.declared}" style="width:110px"> <button data-act="verify" data-q="${esc(x.queueId)}">Approve</button> <button class="no" data-act="verify" data-q="${esc(x.queueId)}" data-r="1">Reject</button></div>`:''}</div>`;
const memRow=m=>`<div class="row s"><div><b>${esc(m.name)}</b> <span class="chip c-${esc(m.label)}">${esc(m.label)}</span><br><span class="m">${esc(m.phone)} · staked ${kes(m.staked)} · joined ${esc(day(m.created))}</span></div><div>${m.status==='Approved'||m.status==='Suspended'?`<button class="${m.status==='Approved'?'no':'g'}" data-act="togglesuspend" data-p="${esc(m.phone)}" data-s="${esc(m.status)}">${m.status==='Approved'?'Suspend':'Activate'}</button> `:''}<button class="g" data-act="open" data-p="${esc(m.phone)}" title="Edit member" aria-label="Edit ${esc(m.name)}">&#9998; Edit</button></div></div>`;
async function loadMemList(){const j=await api('members',{q:memQ,limit:memLimit});$('#mlist').innerHTML=`<p class="m">${j.total} member${j.total===1?'':'s'}${memQ?' matching "'+esc(memQ)+'"':''}</p>`+(j.list.map(memRow).join('')||'<p class="m">No members.</p>')+(j.more?'<button class="g" data-act="moremem">Show more</button>':'');}
const msgCount=()=>{const c=$('#mcount');if(c)c.textContent=msgAll?'Sending to all members.':msgSel.size?`Sending to ${msgSel.size} selected member${msgSel.size===1?'':'s'}.`:'Tick the members to send to.';};

const panes={
  async queue(){const j=await api('payments',{status:payFilter,limit:payLimit});payCounts=j.counts;drawTabs();
    $('#pane').innerHTML=`<div class="seg2">${['Pending','All','Approved','Rejected'].map(f=>`<button class="${f===payFilter?'on':'g'}" data-act="payfilter" data-f="${f}">${f} (${j.counts[f]||0})</button>`).join('')}<button class="g" data-act="exportcsv">Export CSV</button></div>`+(payFilter==='Pending'&&j.list.length?`<div class="card"><input id="pq" placeholder="Filter by name, phone, code or pool" style="width:60%"> <button class="g" data-act="selall">Select all</button> <button data-act="verifymany">Approve selected</button><p class="m">Approves each ticked payment at the amount the member declared. Check the codes first.</p></div>`:'')+
      (j.list.map(payRow).join('')||`<p class="m">${payFilter==='Pending'?'No payments waiting. Check each code against your M-Pesa messages before you approve.':'No payments here.'}</p>`)+(j.more?'<button class="g" data-act="morepay">Show more</button>':'');},
  async resets(){const j=await api('resets');
    const un=j.unlocks.length?j.unlocks.map(x=>`<div class="row"><div><b>${esc(x.name)}</b> · ${esc(x.phone)}<br><span class="m">Locked out, asked ${esc(day(x.time))}. Confirm with them on WhatsApp first.</span> <a target="_blank" rel="noopener" href="https://wa.me/${esc(x.phone)}">WhatsApp</a></div><div><button data-act="decideunlock" data-id="${esc(x.id)}" data-y="1">Unlock</button> <button class="no" data-act="decideunlock" data-id="${esc(x.id)}">Reject</button></div></div>`).join(''):'<p class="m">No unlock requests.</p>';
    const rs=j.list.length?j.list.map(x=>`<div class="row"><div><b>${esc(x.name)}</b> · ${esc(x.phone)}<br><span class="m">Asked ${esc(day(x.time))}. Confirm with them on WhatsApp first.</span> <a target="_blank" rel="noopener" href="https://wa.me/${esc(x.phone)}">WhatsApp</a></div><div><button data-act="decidereset" data-id="${esc(x.id)}" data-y="1">Approve</button> <button class="no" data-act="decidereset" data-id="${esc(x.id)}">Reject</button></div></div>`).join(''):'<p class="m">No PIN reset requests.</p>';
    $('#pane').innerHTML='<h3>Unlock requests</h3>'+un+'<h3>PIN reset requests</h3>'+rs;},
  async members(){await loadPools();$('#pane').innerHTML=`<div class="card"><input id="q" placeholder="Search name or phone" value="${esc(memQ)}"><button data-act="search">Search</button> <button class="g" data-act="clearsearch">Show all</button></div><div id="detail"></div><div id="mlist"></div><div class="card"><b>Record a contribution</b><br><input id="cp" placeholder="Member phone"><select id="cpool">${opts()}</select><input id="ca" type="number" placeholder="Amount (KES)"><button data-act="contrib">Record</button></div>`;await loadMemList();if(curMember)await showMember(curMember,true);},
  async pools(){await loadPools();$('#pane').innerHTML=postCard()+pools.map(poolCard).join('')+'<div id="settle"></div>';updateRule();updateCounters();},
  async msgs(){const [j,ml]=await Promise.all([api('notes'),api('members',{limit:500})]);msgMembers=ml.list.filter(m=>m.status==='Approved');
    $('#pane').innerHTML=`<div class="card"><b>Send a message</b><br><label style="display:flex;gap:10px;align-items:center;margin:8px 0"><input type="checkbox" data-msg="all" style="width:20px;height:20px;margin:0"${msgAll?' checked':''}> <b>Send to all members</b> <span class="m">(${msgMembers.length})</span></label>
      <input data-msg="filter" placeholder="Find a member to tick" style="width:100%;box-sizing:border-box"><div class="seg2"><button class="g" data-act="msgselall">Select all shown</button><button class="g" data-act="msgclear">Clear</button></div>
      <div class="pick${msgAll?' off':''}" id="pick">${msgMembers.map(m=>`<label data-n="${esc((m.name+' '+m.phone).toLowerCase())}"><input type="checkbox" data-msg="m" value="${esc(m.phone)}"${msgSel.has(m.phone)?' checked':''}><span>${esc(m.name)} <span class="m">${esc(m.phone)}</span></span></label>`).join('')||'<p class="m">No active members yet.</p>'}</div>
      <p class="m" id="mcount"></p><input id="mti" maxlength="80" placeholder="Title" style="width:100%;box-sizing:border-box"><textarea id="mb" rows="3" maxlength="600" placeholder="Message (shows on the member's dashboard)"></textarea><button data-act="sendmsg">Send</button></div><h3>Recent</h3>`+(j.list.map(n=>`<div class="m" style="margin-bottom:8px"><b>${esc(n.title)}</b> to ${esc(n.to)} · ${esc(day(n.date))}<br>${esc(n.body)}</div>`).join('')||'<p class="m">Nothing yet.</p>');msgCount();},
  async log(){const j=await api('audit');$('#pane').innerHTML=j.list.map(r=>`<div class="m">${esc(String(r.time).slice(0,16).replace('T',' '))} · ${esc(r.action)} · ${esc(r.detail)}</div>`).join('')||'<p class="m">Nothing yet.</p>';}
};
async function showMember(ph,quiet){curMember=ph;const d=await api('memberDetail',{phone:ph});$('#detail').innerHTML=memberView(d);if(!quiet)$('#detail').scrollIntoView({behavior:'smooth',block:'start'});}
async function showSettle(id){const j=await api('settle',{poolId:id});$('#settle').innerHTML=`<div class="card"><b>Payouts</b> <span class="m">won ${kes(j.won)} · collected ${kes(j.total)} · full stake ${kes(j.full)}</span>`+(j.list.map(m=>`<div class="row"><div>${esc(m.name)} <span class="m">${(m.share*100).toFixed(2)}% · suggested ${kes(m.suggested)} · paid ${kes(m.paid)}</span></div><button data-act="payout" data-id="${esc(id)}" data-p="${esc(m.phone)}" data-a="${Math.max(0,m.suggested-m.paid)}">Record payout</button></div>`).join('')||'<p class="m">No contributions in this pool.</p>')+(j.list.length?`<button data-act="payall" data-id="${esc(id)}">Record all unpaid</button>`:'')+'</div>';}
const ask=(t,d)=>prompt(t,d);
const acts={
  tab(b){tab=b.dataset.t;draw();},
  async out(){try{await api('logout');}catch(e){}T=null;sessionStorage.removeItem('tj_a');draw();},
  async verify(b){const j=await api('verify',{queueId:b.dataset.q,amount:val('amt-'+b.dataset.q),reject:!!b.dataset.r});await panes.queue();note(j.msg);},
  async payfilter(b){payFilter=b.dataset.f;payLimit=50;await panes.queue();},
  async morepay(){payLimit+=50;await panes.queue();},
  async exportcsv(){const j=await api('payments',{status:payFilter,limit:5000}),q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',L=[['Member','Phone','Jackpot / pool','Declared KES','Approved KES','M-Pesa code','Sent','Status','Decided']].concat(j.list.map(x=>[x.name,x.phone,x.pool,x.declared,x.approved==null?'':x.approved,x.ref,x.time,x.status,x.decidedAt]));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='payments-'+payFilter.toLowerCase()+'.csv';a.click();note('Exported '+j.list.length+' payments.');},
  async decidereset(b){const j=await api('decideReset',{id:b.dataset.id,approve:!!b.dataset.y});await panes.resets();note(j.msg);},
  async decideunlock(b){const j=await api('decideUnlock',{id:b.dataset.id,approve:!!b.dataset.y});await panes.resets();note(j.msg);},
  async search(){memQ=val('q').trim();memLimit=50;await loadMemList();},
  async clearsearch(){memQ='';memLimit=50;const q=$('#q');if(q)q.value='';await loadMemList();},
  async moremem(){memLimit+=50;await loadMemList();},
  async togglesuspend(b){const on=b.dataset.s==='Approved';if(!confirm((on?'Suspend':'Activate')+' this member?'+(on?' They will not be able to log in.':'')))return;const j=await api('editMember',{phone:b.dataset.p,fields:{status:on?'Suspended':'Approved'}});await loadMemList();if(curMember===b.dataset.p)await showMember(curMember,true);note(j.msg);},
  async closedetail(){curMember=null;$('#detail').innerHTML='';},
  async open(b){await showMember(b.dataset.p);},
  async savemember(b){const j=await api('editMember',{phone:b.dataset.p,fields:{name:val('mn'),phone:val('mp'),status:val('ms'),payTo:val('mpay')}});await showMember(val('mp'),true);await loadMemList();note(j.msg);},
  async unlockm(b){note((await api('unlockMember',{phone:b.dataset.p})).msg);await showMember(b.dataset.p);},
  async delmember(b){if(!confirm('Delete this member? This cannot be undone.'))return;const j=await api('deleteMember',{phone:b.dataset.p});curMember=null;await panes.members();note(j.msg);},
  async reset(b){const pin=ask('New 4-character PIN (letters or numbers) for this member (tell them on WhatsApp):');if(!pin)return;const j=await api('requestReset',{phone:b.dataset.p,pin});note(j.msg+' Approve it under PIN resets.');},
  async contrib(){note((await api('contribute',{phone:val('cp'),poolId:val('cpool'),amount:val('ca')})).msg);await loadMemList();if(curMember)await showMember(curMember,true);},
  async editcontrib(b){const a=ask('Correct amount (KES):',b.dataset.a);if(!a)return;note((await api('editContribution',{id:b.dataset.id,fields:{amount:a}})).msg);await showMember(curMember);},
  async delcontrib(b){if(!confirm('Delete this contribution? The member is notified.'))return;note((await api('deleteContribution',{id:b.dataset.id})).msg);await showMember(curMember);},
  async editpayrec(b){const a=ask('Correct payout amount (KES):',b.dataset.a);if(!a)return;note((await api('editPayout',{id:b.dataset.id,fields:{amount:a}})).msg);await showMember(curMember);},
  async delpayrec(b){if(!confirm('Delete this payout record? The member is notified.'))return;note((await api('deletePayout',{id:b.dataset.id})).msg);await showMember(curMember);},
  async loadfx(){const r=parseFixtures(val('pj-paste'));fx=r.list;fxInfo=r.list.length?'Read '+r.list.length+' matches ('+r.format+' format).'+(r.warn.length?' '+r.warn.join(' '):''):'No matches found in that text. '+r.warn.join(' ');$('#pj-prev').innerHTML=previewHtml();$('#pj-info').textContent=fxInfo;updateCounters();},
  async clearfx(){fx=[];fxInfo='';const t=$('#pj-paste');if(t)t.value='';$('#pj-prev').innerHTML='';$('#pj-info').textContent='';updateCounters();},
  async replacefx(b){replaceId=b.dataset.id;replaceName=b.dataset.n;fxJack=b.dataset.j;fx=[];fxInfo='';await panes.pools();window.scrollTo(0,0);note('Paste the full fixture list again, tick the doubles, then Save fixtures.');},
  async cancelreplace(){replaceId=null;fx=[];fxInfo='';await panes.pools();},
  async publishfx(){const c=need(),d=fx.filter(r=>r.dc).length;
    if(!confirm((replaceId?'Replace the fixtures of ':'Post ')+c.name+' with '+fx.length+' matches ('+d+' doubles)'+(replaceId?'?':' to the website?')))return;
    const matches=fx.map(r=>({home:r.home.trim(),away:r.away.trim(),league:r.league.trim(),kickoff:r.kick,type:r.dc?'DC':'S'}));
    const j=replaceId?await api('saveMatches',{poolId:replaceId,matches}):await api('publishJackpot',{jackpot:fxJack,prize:pj.prize,fee:pj.fee,minStake:pj.min,matches});
    fx=[];fxInfo='';replaceId=null;pj.prize='';await panes.pools();note(j.msg);},
  async savepool(b){const id=b.dataset.id,f={name:val('nm-'+id),status:val('st-'+id),prize:val('pz-'+id),won:val('wn-'+id),fee:val('fe-'+id),min:val('mi-'+id)},k=val('ko-'+id);if(k)f.kickoff=fromLocal(k);const j=await api('updatePool',{poolId:id,fields:f});await panes.pools();note(j.msg);},
  async delpool(b){if(!confirm('Delete this pool?'))return;const j=await api('deletePool',{poolId:b.dataset.id});await panes.pools();note(j.msg);},
  async settle(b){await showSettle(b.dataset.id);},
  selall(){const c=[...document.querySelectorAll('.pk')].filter(x=>x.closest('.row').style.display!=='none');const on=c.some(x=>!x.checked);c.forEach(x=>x.checked=on);},
  async verifymany(){const ids=[...document.querySelectorAll('.pk:checked')].map(x=>x.dataset.q);if(!ids.length)return note('Tick at least one payment first.',true);if(!confirm('Approve '+ids.length+' payment(s) at the declared amounts?'))return;const j=await api('verifyMany',{ids});await panes.queue();note(j.msg);},
  async payall(b){if(!confirm('Record every unpaid suggested payout for this pool? Members are notified.'))return;const j=await api('payoutMany',{poolId:b.dataset.id});await showSettle(b.dataset.id);note(j.msg);},
  async payout(b){const a=ask('Amount paid out (KES):',b.dataset.a);if(!a)return;const j=await api('payout',{poolId:b.dataset.id,phone:b.dataset.p,amount:a,note:'M-Pesa'});await showSettle(b.dataset.id);note(j.msg);},
  async msgselall(){document.querySelectorAll('#pick label').forEach(l=>{if(l.style.display==='none')return;const c=l.querySelector('input');c.checked=true;msgSel.add(c.value);});msgCount();},
  async msgclear(){msgSel.clear();document.querySelectorAll('#pick input').forEach(c=>c.checked=false);msgCount();},
  async sendmsg(){if(!msgAll&&!msgSel.size)throw new Error('Tick at least one member, or choose Send to all.');if(!confirm(msgAll?'Send this message to ALL members?':'Send this message to '+msgSel.size+' member(s)?'))return;const j=await api('message',{to:msgAll?'ALL':Array.from(msgSel),title:val('mti'),body:val('mb')});msgSel.clear();await panes.msgs();note(j.msg);}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)run(()=>acts[b.dataset.act](b));});
document.addEventListener('input',e=>{if(e.target.id!=='pq')return;const t=e.target.value.toLowerCase();document.querySelectorAll('#pane .row').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(t)?'':'none';});});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();run(()=>acts.search());}});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset&&t.dataset.fx,g=t.dataset&&t.dataset.msg;
  if(g){if(g==='all'){msgAll=t.checked;$('#pick').classList.toggle('off',msgAll);}else if(g==='m'){t.checked?msgSel.add(t.value):msgSel.delete(t.value);}else if(g==='filter'){const f=t.value.toLowerCase().trim();document.querySelectorAll('#pick label').forEach(l=>l.style.display=!f||l.dataset.n.indexOf(f)>-1?'':'none');}msgCount();return;}
  if(k){const r=fx[+t.dataset.i];if(!r)return;if(k==='dc')r.dc=t.checked;else if(k==='kick')r.kick=fromLocal(t.value);else r[k]=t.value;updateCounters();return;}
  if(t.id==='pj-jack'){fxJack=t.value;updateRule();updateCounters();}
  else if(t.id==='pj-prize')pj.prize=t.value;else if(t.id==='pj-fee')pj.fee=t.value;else if(t.id==='pj-min')pj.min=t.value;});
draw();
</script></body></html>
